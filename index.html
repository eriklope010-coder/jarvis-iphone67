<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis Midas</title>
<meta name="description" content="JARVIS MIDAS, asistente personal con IA.">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one-screen stage. WebGL orb + pedestal live in a fixed canvas; the DOM marks slots that the 3D scene aligns to. */
:root{
  --obsidian:#080808; --deep:#050505; --charcoal:#111111; --surface:#191919;
  --gold:#C6A66A; --gold-muted:#9B8157; --white:#F1EEE8; --text2:#96918A;
  --gold-line:rgba(198,166,106,.38); --gold-faint:rgba(198,166,106,.12);
  --danger:#B5654F;
  --f-display:"Marcellus SC","Optima","Palatino Linotype",Georgia,serif;
  --f-body:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{height:100%;margin:0;font-size:14px;}
img{max-width:100%;}
[hidden]{display:none!important;}
body{background:var(--deep);color:var(--white);font-family:var(--f-body);font-weight:300;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(70% 38% at 50% 36%,#17120b 0%,rgba(12,10,8,0) 70%),radial-gradient(130% 80% at 50% 40%,#0e0d0c 0%,var(--obsidian) 50%,var(--deep) 100%);}
#stage .sweeps{position:absolute;inset:0;width:100%;height:100%;opacity:.55;}
#orbView{position:fixed;z-index:1;left:0;top:0;width:10px;height:10px;pointer-events:none;transform-origin:50% 50%;
  transition:left .9s cubic-bezier(.22,.7,.2,1),top .9s cubic-bezier(.22,.7,.2,1),width .9s cubic-bezier(.22,.7,.2,1),height .9s cubic-bezier(.22,.7,.2,1);}
#orbView img{width:100%;height:100%;object-fit:contain;display:block;transition:filter 1.2s ease;}
#orbView .orbLight{position:absolute;inset:6% 12%;border-radius:50%;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(closest-side,rgba(232,201,140,.0) 52%,rgba(222,184,112,.42) 70%,rgba(198,166,106,0) 100%);}
#orbView .orbCore{position:absolute;inset:30% 34%;border-radius:50%;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(closest-side,rgba(255,226,170,.55),rgba(198,166,106,.18) 55%,rgba(198,166,106,0) 100%);}
#orbView.st-error img{filter:saturate(.55) brightness(.72) sepia(.25);}
#orbView.st-annoyed img{filter:contrast(1.12) saturate(.85);}
#orbView.st-happy img{filter:brightness(1.1) saturate(1.12);}
#pedSlot{display:flex;align-items:center;justify-content:center;}
#pedSlot img{width:118%;max-width:none;height:100%;object-fit:contain;pointer-events:none;}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 6px;
  max-width:520px;margin:0 auto;box-sizing:border-box;pointer-events:none;}
.app > *{pointer-events:auto;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:8px;}

/* header */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:10px;}
.brand{text-align:center;}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.62em;padding-left:.62em;color:var(--gold);}
.brand .rule{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
.brand .rule i{height:1px;width:72px;background:linear-gradient(90deg,transparent,var(--gold-line));}
.brand .rule i:last-child{transform:scaleX(-1);}
.brand .rule b{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px rgba(198,166,106,.6);}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold-line);
  background:radial-gradient(circle at 35% 30%,#1d1912,#0b0a08);color:var(--gold);transition:transform .2s,border-color .2s;}
.iconbtn:active{transform:scale(.94);}
.iconbtn svg{width:20px;height:20px;}

/* orb slot */
#orbSlot{flex:1 1 auto;min-height:180px;cursor:pointer;position:relative;}
#orbSlot .hint{position:absolute;inset:auto 0 0;text-align:center;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text2);opacity:0;transition:opacity .4s;}
.ident{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ident h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:2.15rem;letter-spacing:.42em;padding-left:.42em;
  background:linear-gradient(180deg,#E9D7AE 0%,var(--gold) 45%,var(--gold-muted) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ident p{margin:0;font-size:1.06rem;color:#D9D3C8;letter-spacing:.01em;}
.wave{display:flex;align-items:center;gap:10px;margin-top:8px;}
.wave i.l{height:1px;width:clamp(40px,22vw,110px);background:linear-gradient(90deg,transparent,var(--gold-line));}
.wave i.l:last-child{transform:scaleX(-1);}
.bars{display:flex;align-items:center;gap:3px;height:42px;}
.bars span{width:2px;border-radius:1px;background:var(--gold);height:8px;transition:height .12s ease-out;opacity:.85;}
#talkBtn{padding:6px 10px;border-radius:24px;}
#pedSlot{height:clamp(64px,11vh,104px);flex:none;overflow:visible;}

/* cards */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2.2vw,12px);margin-top:4px;}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;aspect-ratio:1/1.12;max-width:100%;
  border-radius:18px;text-decoration:none;color:var(--white);font-size:clamp(.62rem,2.6vw,.8rem);letter-spacing:.01em;
  background:linear-gradient(160deg,#1c1914 0%,#0d0c0a 55%,#080807 100%);
  border:1px solid var(--gold-line);
  box-shadow:inset 0 1px 0 rgba(241,238,232,.07),inset 0 -12px 22px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.55);
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(198,166,106,.12) 48%,transparent 62%);transform:translateX(-120%);transition:transform .7s;}
.card:hover::after,.card:focus-visible::after{transform:translateX(120%);}
.card:active{transform:scale(.95);border-color:var(--gold);}
.card svg{width:44%;height:auto;color:var(--gold);filter:drop-shadow(0 0 6px rgba(198,166,106,.25));}
.foot{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;font-size:.62rem;letter-spacing:.32em;color:var(--gold-muted);text-transform:uppercase;white-space:nowrap;}
.foot i{height:1px;flex:1;max-width:80px;background:linear-gradient(90deg,transparent,var(--gold-line));}
.foot i:last-child{transform:scaleX(-1);}

/* call mode */
.call{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  opacity:0;transition:opacity .6s ease;}
body.in-call .call{opacity:1;}
body.in-call .call > *{pointer-events:auto;}
body.in-call .home-only{opacity:0;pointer-events:none;transform:translateY(10px);}
.home-only{transition:opacity .5s,transform .5s;}
.callTop{display:flex;justify-content:space-between;align-items:center;max-width:520px;width:100%;margin:0 auto;}
.pill{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-muted);}
.pill.live .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.pill.mic .dot{background:#d4b37a;animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.25}}
#callOrb{flex:1 1 auto;min-height:200px;cursor:pointer;}
.stateLabel{text-align:center;font-family:var(--f-display);letter-spacing:.34em;padding-left:.34em;color:var(--gold);font-size:.9rem;min-height:1.3em;}
.transcript{max-width:520px;width:100%;margin:10px auto 0;max-height:22vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:.95rem;line-height:1.45;mask-image:linear-gradient(180deg,transparent,#000 22%);-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%);padding-top:18px;}
.transcript p{margin:0;min-width:0;overflow-wrap:anywhere;}
.transcript .u{color:var(--text2);}
.transcript .u::before{content:"Tú  ·  ";color:var(--gold-muted);font-size:.72rem;letter-spacing:.14em;}
.transcript .j{color:var(--white);}
.transcript .j::before{content:"Jarvis  ·  ";color:var(--gold);font-size:.72rem;letter-spacing:.14em;}
.transcript .sys{color:var(--gold-muted);font-size:.82rem;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin:10px auto 0;}
.chip{border:1px solid var(--gold-line);border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--gold);background:rgba(17,17,17,.8);text-decoration:none;}
.composer{max-width:520px;width:100%;margin:12px auto 0;display:flex;gap:8px;align-items:center;}
.composer input[type=text]{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid var(--gold-line);background:rgba(17,17,17,.82);color:var(--white);padding:0 18px;font:inherit;font-size:1rem;}
.composer input::placeholder{color:#6f6a63;}
.composer .iconbtn{flex:none;width:46px;height:46px;}
.endRow{display:flex;justify-content:center;margin-top:14px;gap:14px;}
#endBtn{height:54px;padding:0 30px;border-radius:27px;background:linear-gradient(180deg,#3a1d16,#22100c);border:1px solid rgba(181,101,79,.6);color:#F1D9D0;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;}
#imgPreview{max-width:520px;margin:8px auto 0;display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--text2);}
#imgPreview img{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--gold-line);}
body.car .transcript,body.car .chips .opt,body.car #attachBtn{display:none;}
body.car .stateLabel{font-size:1.5rem;}
body.car #endBtn{height:72px;padding:0 48px;font-size:1rem;}
body.car .composer input[type=text]{height:56px;font-size:1.15rem;}

/* sheet */
.sheet{position:fixed;inset:0;z-index:5;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.sheet .in{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}
.sheetHead{display:flex;justify-content:space-between;align-items:center;}
.sheetHead h3{margin:0;font-family:var(--f-display);font-weight:400;letter-spacing:.3em;color:var(--gold);font-size:1rem;}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px;}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--gold-faint);color:var(--text2);font-size:.85rem;}
.tabs button[aria-selected=true]{border-color:var(--gold-line);color:var(--gold);background:var(--charcoal);}
.pane{flex:1;overflow-y:auto;margin-top:14px;padding-bottom:28px;min-height:0;}
.pane h4{margin:18px 0 8px;font-weight:500;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-muted);}
.pane p.note{color:var(--text2);font-size:.88rem;line-height:1.5;margin:6px 0;max-width:62ch;}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1d1b18;}
.row label{font-size:.95rem;}
.row small{display:block;color:var(--text2);font-size:.78rem;margin-top:2px;}
.item{padding:12px 0;border-bottom:1px solid #1d1b18;display:flex;gap:10px;align-items:flex-start;}
.item .txt{flex:1;min-width:0;font-size:.95rem;line-height:1.4;overflow-wrap:anywhere;}
.item .meta{font-size:.72rem;color:var(--text2);margin-top:3px;letter-spacing:.04em;}
.item textarea{width:100%;box-sizing:border-box;background:var(--charcoal);border:1px solid var(--gold-line);color:var(--white);border-radius:10px;padding:8px;font:inherit;}
.mini{font-size:.78rem;color:var(--gold);padding:6px 10px;border:1px solid var(--gold-faint);border-radius:8px;flex:none;}
.mini.warn{color:#E0A894;border-color:rgba(181,101,79,.4);}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--gold-line);color:var(--gold);background:var(--charcoal);font-size:.9rem;}
.btn.warn{color:#E8B4A3;border-color:rgba(181,101,79,.55);}
.field{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.field input,.field select{flex:1;min-width:140px;height:42px;border-radius:10px;border:1px solid var(--gold-line);background:var(--charcoal);color:var(--white);padding:0 12px;font:inherit;}
select{appearance:none;-webkit-appearance:none;}
.switch{position:relative;width:46px;height:28px;flex:none;}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;}
.switch span{position:absolute;inset:0;border-radius:14px;background:#262320;border:1px solid #3a352d;transition:.2s;pointer-events:none;}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8378;transition:.2s;}
.switch input:checked + span{background:#3a3020;border-color:var(--gold-muted);}
.switch input:checked + span::after{left:21px;background:var(--gold);}
.switch input:focus-visible + span{outline:1.5px solid var(--gold);outline-offset:2px;}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.modes button{padding:12px;border-radius:12px;border:1px solid var(--gold-faint);text-align:left;background:var(--charcoal);}
.modes button b{display:block;font-weight:500;font-size:.9rem;}
.modes button small{color:var(--text2);font-size:.74rem;}
.modes button[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);}
.modes button[aria-pressed=true] b{color:var(--gold);}
table.lim{width:100%;border-collapse:collapse;font-size:.86rem;}
table.lim td,table.lim th{border-bottom:1px solid #1d1b18;padding:9px 6px;text-align:left;vertical-align:top;}
table.lim th{color:var(--gold-muted);font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;}
.ok{color:#B7C79A}.no{color:#D49A86}.mid{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);z-index:9;max-width:min(90vw,440px);
  background:rgba(17,17,17,.96);border:1px solid var(--gold-line);border-radius:14px;padding:12px 16px;font-size:.9rem;line-height:1.4;opacity:0;transition:.35s;pointer-events:none;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#banner{font-size:.7rem;line-height:1.35;color:var(--text2);text-align:center;margin-top:6px;min-height:1em;}
@media (max-height:700px){.ident h2{font-size:1.7rem}.ident p{font-size:.95rem}.bars{height:32px}.foot{margin-top:8px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>

<script>
"use strict";
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim();
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
let toastT; function toast(msg,ms=3800){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),ms);}

/* ================= apps (launcher) ================= */
const APPS = [
  {id:"whatsapp",name:"WhatsApp",url:"https://wa.me/",alias:["whatsapp","wasap","guasap","wassap","whats","wsp","wasa","whatsap"],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><circle cx="8" cy="11.5" r=".9" fill="currentColor"/><circle cx="12" cy="11.5" r=".9" fill="currentColor"/><circle cx="16" cy="11.5" r=".9" fill="currentColor"/></svg>'},
  {id:"spotify",name:"Spotify",url:"https://open.spotify.com/",alias:["spotify","spoty","spoti","espotifai","espoti","spotifai","spotyfy","musica"],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 10v4M7.5 7v10M11 4v16M14.5 8v8M18 10.5v3M21 11.5v1"/></svg>'},
  {id:"instagram",name:"Instagram",url:"https://www.instagram.com/",alias:["instagram","insta","instagran","ig","instagra"],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7H8l1.5-2.5h5L16 7h3.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>'},
  {id:"tiktok",name:"TikTok",url:"https://www.tiktok.com/",alias:["tiktok","tik tok","tictoc","tic toc","tictok","tiktoc","titok"],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path d="M9 9.5l11-2"/></svg>'},
  {id:"plex",name:"Plex",url:"https://app.plex.tv/",alias:["plex","pleks","plexs","plec","pelis"],
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg>'}
];
function findApp(text){
  const t = " "+norm(text)+" ";
  for(const a of APPS) for(const al of a.alias) if(t.includes(" "+al+" ")) return a;
  return null;
}
/* Opening must happen inside a user gesture. We never claim success: we watch whether iOS actually left the page. */
function launch(app, viaAnchor){
  if(!viaAnchor){ const a=document.createElement("a"); a.href=app.url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }
  let left=false; const onHide=()=>{ if(document.hidden) left=true; };
  document.addEventListener("visibilitychange",onHide);
  setTimeout(()=>{ document.removeEventListener("visibilitychange",onHide);
    if(left) toast(app.name+" se abrió.");
    else toast("He enviado el enlace de "+app.name+". No puedo confirmar que la app se abriera: si no la ves, ábrela desde la pestaña nueva.",5200);
  },1600);
}
function renderCards(){
  $("#cards").innerHTML = APPS.map(a=>`<a class="card" href="${a.url}" target="_blank" rel="noopener" data-app="${a.id}" aria-label="Abrir ${a.name}">${a.icon}<span>${a.name}</span></a>`).join("");
  $("#cards").addEventListener("click",e=>{const c=e.target.closest(".card"); if(!c) return; launch(APPS.find(a=>a.id===c.dataset.app),true);});
}

/* ================= state & persistence ================= */
const MODES = {
  normal:{n:"Normal",d:"Equilibrado",rule:"Responde en 1-3 frases salvo que pida más detalle."},
  conversacion:{n:"Conversación",d:"Charla larga",rule:"Conversa con naturalidad, puedes extenderte un poco y hacer preguntas de vuelta."},
  trabajo:{n:"Trabajo",d:"Preciso",rule:"Sé preciso y estructurado. Humor mínimo. Prioriza tareas y siguientes pasos."},
  enfoque:{n:"Enfoque",d:"Mínimo",rule:"Respuestas de una frase. Nada proactivo. Sin bromas."},
  coche:{n:"Coche",d:"Solo voz",rule:"El usuario conduce: máximo 1-2 frases muy cortas, nada de listas, nunca le pidas mirar la pantalla."},
  ocio:{n:"Ocio",d:"Más humor",rule:"Tono relajado, más humor y recomendaciones de música, series o planes."},
  descanso:{n:"Descanso",d:"Calma",rule:"Tono sereno y suave, respuestas breves, nada de estímulos innecesarios."}
};
const DEFAULT_PREFS = {mode:"normal",proactive:"normal",voiceURI:"",rate:1.0,transcript:true,handsfree:true,wake:false,
  rememberLong:true,rememberEpisodic:true,allowSensitive:false,model:"default",lastGreet:-1,name:""};
const S = {
  state:"idle", emotion:null, emotionUntil:0, amp:0, speaking:false, listening:false,
  inCall:false, callStart:0, prefs:{...DEFAULT_PREFS},
  convo:[], memories:[], tasks:[], commands:[],
  db:null, uid:null, storage:"pending", micOK:null, img:null, busy:null
};
const P = () => "data/users/"+S.uid;
/* Memory, tasks, commands and settings persist in this browser (localStorage). Export them from Ajustes › Memoria. */
const LocalDB=(()=>{
  const KEY="midas:"; const listeners={};
  const load=c=>{ try{ return JSON.parse(localStorage.getItem(KEY+c)||"{}"); }catch{ return {}; } };
  const emit=c=>{ (listeners[c]||new Set()).forEach(fn=>fn()); };
  const save=(c,m)=>{ try{ localStorage.setItem(KEY+c,JSON.stringify(m)); }catch(e){ throw Object.assign(new Error("storage"),{code:"almacenamiento_lleno"}); } emit(c); };
  const split=p=>{ const i=p.lastIndexOf("/"); return [p.slice(0,i),p.slice(i+1)]; };
  const on=(c,fn)=>{ (listeners[c]=listeners[c]||new Set()).add(fn); queueMicrotask(fn); return ()=>listeners[c].delete(fn); };
  const snap=(id,d)=>({id,exists:d!==undefined,data:()=>d});
  function collection(c,order){ return {
    add:async d=>{ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); const m=load(c); m[id]=d; save(c,m); return {id}; },
    orderBy:(f,dir)=>collection(c,{f,dir}),
    onSnapshot:(cb)=>on(c,()=>{ let docs=Object.entries(load(c)).map(([id,d])=>snap(id,d)); if(order) docs.sort((a,b)=>{ const x=a.data()[order.f]||0,y=b.data()[order.f]||0; return order.dir==="desc"?y-x:x-y; }); cb({docs}); })
  }; }
  function doc(p){ const [c,id]=split(p); return {
    set:async d=>{ const m=load(c); m[id]=JSON.parse(JSON.stringify(d)); save(c,m); },
    delete:async()=>{ const m=load(c); delete m[id]; save(c,m); },
    onSnapshot:(cb)=>on(c,()=>cb(snap(id,load(c)[id])))
  }; }
  return {collection,doc};
})();
/* Server settings (URL + device token) stay in this browser only — never in the repository. */
function apiCfg(){ try{ return JSON.parse(localStorage.getItem("midas:cfg")||"{}"); }catch{ return {}; } }
function saveCfg(c){ try{ localStorage.setItem("midas:cfg",JSON.stringify(c)); }catch{} }
async function boot(){
  let ok=true; try{ localStorage.setItem("midas:probe","1"); localStorage.removeItem("midas:probe"); }catch{ ok=false; }
  S.uid="local";
  if(ok){ S.db=LocalDB; subscribe(); } else { S.storage="off"; }
  setTimeout(()=>{
    if(!ok) setBanner("Este navegador no deja guardar datos (¿modo privado?). La memoria no se conservará.");
    else if(!apiCfg().url) setBanner("Configura tu servidor en Ajustes › Servidor para activar la IA.");
  },60);
}
function setBanner(t){ $("#banner").textContent=t; }
function subscribe(){
  const db=S.db; let gotAny=false;
  const timer=setTimeout(()=>{ if(!gotAny){S.storage="slow"; setBanner("La memoria tarda en responder. Sigo funcionando; guardaré cuando conecte.");}},10000);
  const ok=()=>{ if(!gotAny){gotAny=true; clearTimeout(timer); S.storage="on"; setBanner("");} };
  const fail=e=>{ clearTimeout(timer); S.storage="off"; setBanner("No pude abrir la memoria ("+(e&&e.code||"error")+"). No se guardarán cambios."); };
  db.doc(P()+"/prefs").onSnapshot(s=>{ ok(); if(s.exists) S.prefs={...DEFAULT_PREFS,...s.data()}; applyPrefs(); refreshPane(); },fail);
  db.doc(P()+"/convo").onSnapshot(s=>{ ok(); if(s.exists && !S.convo.length){ const d=s.data(); S.convo=Array.isArray(d.turns)?d.turns.slice(-24):[]; } },fail);
  db.collection(P()+"/m/memories").orderBy("updated","desc").onSnapshot(q=>{ ok(); S.memories=q.docs.map(d=>({id:d.id,...d.data()})); refreshPane(); },fail);
  db.collection(P()+"/m/tasks").orderBy("created","desc").onSnapshot(q=>{ ok(); S.tasks=q.docs.map(d=>({id:d.id,...d.data()})); refreshPane(); },fail);
  db.collection(P()+"/m/commands").onSnapshot(q=>{ ok(); S.commands=q.docs.map(d=>({id:d.id,...d.data()})); refreshPane(); },fail);
}
const writeQ = {}; // one write at a time per doc
async function dbSet(path,data){ if(!S.db) return false; const prev=writeQ[path]||Promise.resolve(); const p=prev.then(()=>S.db.doc(path).set(data)).then(()=>true).catch(e=>{toast("No se pudo guardar: "+(e.code||"error"));return false;}); writeQ[path]=p; return p; }
async function dbDel(path){ if(!S.db) return false; try{ await S.db.doc(path).delete(); return true;}catch(e){toast("No se pudo borrar: "+(e.code||"error"));return false;} }
async function dbAdd(coll,data){ if(!S.db) return null; try{ const r=await S.db.collection(P()+coll).add(data); return r.id; }catch(e){ toast("No se pudo guardar: "+(e.code||"error")); return null; } }
let prefsT; function savePrefs(){ applyPrefs(); clearTimeout(prefsT); prefsT=setTimeout(()=>dbSet(P()+"/prefs",{...S.prefs}),400); }
let convoT; function saveConvo(){ clearTimeout(convoT); convoT=setTimeout(()=>dbSet(P()+"/convo",{turns:S.convo.slice(-24),updated:Date.now()}),800); }
function applyPrefs(){ document.body.classList.toggle("car",S.prefs.mode==="coche"); $("#transcript").hidden=!S.prefs.transcript; }

/* ================= voice: output ================= */
let voices=[];
function loadVoices(){ voices = (speechSynthesis?.getVoices()||[]).filter(v=>/^es/i.test(v.lang)); refreshPane(); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
const MALE = /jorge|diego|alvaro|álvaro|pablo|enrique|carlos|juan|miguel|male|hombre|antonio|raul|sergio|dario/i;
function pickVoice(){
  if(S.prefs.voiceURI){ const v=voices.find(v=>v.voiceURI===S.prefs.voiceURI); if(v) return v; }
  const es=voices.filter(v=>/es[-_]ES/i.test(v.lang));
  return es.find(v=>MALE.test(v.name)) || es[0] || voices.find(v=>MALE.test(v.name)) || voices[0] || null;
}
function speak(text){
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || !text){ res(); return; }
    speechSynthesis.cancel();
    const clean=text.replace(/https?:\/\/\S+/g,"el enlace").replace(/[*_#`]/g,"");
    const u=new SpeechSynthesisUtterance(clean); const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="es-ES";
    u.rate=S.prefs.rate||1; u.pitch=.92;
    u.onstart=()=>{S.speaking=true; setState("speaking");};
    u.onboundary=()=>{S.amp=1;};
    const done=()=>{S.speaking=false; S.amp=0; res();};
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  });
}
function interrupt(){ if(S.speaking){ speechSynthesis.cancel(); S.speaking=false; setState("listening"); } if(S.busy){ S.busy.abort(); S.busy=null; } }

/* ================= voice: input ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recMode=null;
function micUI(){
  const pill=$("#micPill"); pill.classList.toggle("mic",S.listening);
  $("#micText").textContent = S.micOK===false ? "Micrófono no disponible" : S.listening ? "Escuchando" : "Micrófono en pausa";
}
function startListening(mode="call"){
  if(!SR){ S.micOK=false; micUI(); toast("Este navegador no ofrece reconocimiento de voz. Escribe tu mensaje."); return; }
  if(S.micOK===false) return;
  try{ rec && rec.abort(); }catch{}
  rec=new SR(); rec.lang="es-ES"; rec.interimResults=true; rec.continuous=(mode==="wake"); recMode=mode;
  let finalText="";
  rec.onstart=()=>{ S.micOK=true; S.listening=true; micUI(); if(mode==="call" && !S.busy) setState("listening"); };
  rec.onresult=e=>{
    let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript; }
    if(S.speaking && (finalText||interim).trim().length>3) interrupt();
    if(mode==="call") $("#msg").value=(finalText||interim);
    if(mode==="wake"){ const t=norm(finalText||interim); if(/\bjarvis\b/.test(t) && finalText){ try{rec.abort();}catch{} const rest=t.replace(/.*?\bjarvis\b/,"").trim(); enterCall(rest||null); } }
  };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ S.micOK=false; toast("El micrófono no está permitido aquí. Puedes escribir; la voz de Jarvis sigue activa.",5200); } S.listening=false; micUI(); };
  rec.onend=()=>{ S.listening=false; micUI();
    if(mode==="call" && finalText.trim()){ $("#msg").value=""; handleInput(finalText.trim(),{voice:true}); }
    else if(mode==="call" && S.inCall && !S.busy && !S.speaking) setState("call");
    if(mode==="wake" && !S.inCall && S.prefs.wake && S.micOK) setTimeout(()=>startListening("wake"),400);
  };
  try{ rec.start(); }catch{ S.micOK=false; micUI(); }
}
function stopListening(){ try{ rec && rec.abort(); }catch{} S.listening=false; micUI(); }

/* ================= orb state ================= */
const LABELS={idle:"EN LÍNEA",listening:"TE ESCUCHO",processing:"PROCESANDO",thinking:"PENSANDO",speaking:"HABLANDO",happy:"",annoyed:"",call:"EN LÍNEA",error:"ERROR"};
function setState(s){ S.state=s; const l=LABELS[s]; if(l!=="" ) $("#stateLabel").textContent=l; }
function emote(e){ if(e==="happy"||e==="annoyed"){ S.emotion=e; S.emotionUntil=performance.now()+2600; } }

/* ================= call mode ================= */
let clockT;
const GREET = ["Dime, ¿qué pasa?","¿Qué necesitas?","A tu disposición.","Aquí estoy.","Cuéntame.","¿Qué se te ofrece?","Venga, te escucho."];
function greeting(){
  let i; do{ i=Math.floor(Math.random()*GREET.length);}while(i===S.prefs.lastGreet && GREET.length>1);
  S.prefs.lastGreet=i; savePrefs();
  const h=new Date().getHours(); const nm=S.prefs.name?(", "+S.prefs.name):"";
  let g = GREET[i];
  if(Math.random()<.45) g = (h<6?"¿Tú no duermes"+nm+"? ":h<13?"Buenos días"+nm+". ":h<21?"Buenas tardes"+nm+". ":"Buenas noches"+nm+". ") + g;
  const open=S.tasks.filter(t=>!t.done);
  if(S.prefs.proactive!=="off" && S.prefs.mode!=="enfoque" && open.length && Math.random()<(S.prefs.proactive==="high"?1:.5))
    g += open.length===1 ? " Por cierto, tienes pendiente: "+open[0].text+"." : " Tienes "+open.length+" tareas pendientes, por si quieres repasarlas.";
  return g;
}
async function enterCall(firstUtterance){
  if(S.inCall) return;
  S.inCall=true; document.body.classList.add("in-call"); $("#call").setAttribute("aria-hidden","false");
  stopListening(); S.callStart=Date.now(); $("#chips").innerHTML=""; setState("call");
  clockT=setInterval(()=>{const s=Math.floor((Date.now()-S.callStart)/1000); $("#callClock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
  layout();
  if(firstUtterance){ handleInput(firstUtterance,{voice:true}); return; }
  const g=greeting(); addLine("j",g); await speak(g); if(!S.inCall) return;
  setState("call"); if(S.prefs.handsfree && S.micOK!==false) startListening("call");
}
function endCall(){
  interrupt(); stopListening(); clearInterval(clockT);
  S.inCall=false; document.body.classList.remove("in-call"); $("#call").setAttribute("aria-hidden","true");
  setState("idle"); layout(); $("#callClock").textContent="00:00";
  if(S.prefs.wake && S.micOK!==false) setTimeout(()=>startListening("wake"),600);
}
function addLine(cls,text){ const p=document.createElement("p"); p.className=cls; p.textContent=text; const t=$("#transcript"); t.appendChild(p); while(t.children.length>40) t.firstChild.remove(); t.scrollTop=t.scrollHeight; return p; }

/* ================= command engine ================= */
const OPEN_RE=/^(?:jarvis[ ,]*)?(?:abre(?:me)?|ponme|pon|entra (?:en|a)|lanza|quiero ver|ve a|vamos a|inicia|arranca|abrir)\b/;
function localIntent(raw){
  const t=norm(raw).replace(/^jarvis\s*/,"");
  // custom commands first
  for(const c of S.commands){ const ph=norm(c.phrase).replace(/^jarvis\s*/,""); if(ph && (t===ph || t.startsWith(ph))) return {type:"custom",cmd:c}; }
  if(/^(vuelve|volver) a jarvis/.test(t)) return {type:"say",text:"Ya estás conmigo. ¿Qué necesitas?"};
  const app=findApp(t);
  if(app && (OPEN_RE.test(norm(raw)) || t===norm(app.name) || app.alias.includes(t))) return {type:"open",app};
  const m=t.match(/^(?:modo|activa (?:el )?modo|pon (?:el )?modo) (normal|conversacion|trabajo|enfoque|coche|ocio|descanso)/);
  if(m) return {type:"mode",mode:m[1]};
  if(/^(para|calla|silencio|basta|stop)$/.test(t)) return {type:"stop"};
  return null;
}
function runCustom(c){
  if(c.mode && MODES[c.mode]){ S.prefs.mode=c.mode; savePrefs(); }
  const app=APPS.find(a=>a.id===c.app);
  return {app, say:c.say || ("Hecho: "+c.phrase+".")};
}

/* ================= memory retrieval ================= */
const STOP=new Set("de la que el en y a los se del las un por con no una su para es al lo como mas o pero sus le ya me mi yo tu te si eso esta este".split(" "));
const toks=s=>norm(s).split(" ").filter(w=>w.length>2 && !STOP.has(w));
function relevantMemories(query,max=40){
  const q=new Set(toks(query+" "+S.convo.slice(-4).map(t=>t.content).join(" ")));
  const now=Date.now();
  return S.memories.map(m=>{ let sc=0; for(const w of toks(m.text)) if(q.has(w)) sc+=2; sc+= m.kind==="preferencia"?1:0; sc+=Math.max(0,1-(now-(m.updated||0))/(1000*86400*60)); return {m,sc}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,max).map(x=>x.m);
}


/* ================= backend client ================= */
async function askBackend(system,messages,img,signal){
  const {url,token}=apiCfg();
  const body={system,messages,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone};
  if(img) body.image=await imageToBase64(img);
  let r;
  try{ r=await fetch(url.replace(/\/+$/,"")+"/chat",{method:"POST",signal,headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify(body)}); }
  catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"offline"}; }
  let j=null; try{ j=await r.json(); }catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; }
  if(!r.ok) throw {code:(j&&j.code)||("http_"+r.status)};
  const raw=String((j&&j.text)||"");
  const out=parseLooseJSON(raw) || {reply:raw.trim()};
  out.sources=(j&&j.sources)||[];
  return out;
}
function parseLooseJSON(t){ const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<=a) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch{ return null; } }
function imageToBase64(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res({media_type:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]}); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej({code:"image_rejected"}); };
    img.src=u;
  });
}
function showSources(list){
  for(const s of list.slice(0,4)){ const a=document.createElement("a"); a.className="chip opt"; a.href=s.url; a.target="_blank"; a.rel="noopener"; a.textContent=s.title.length>38?s.title.slice(0,36)+"…":s.title; $("#chips").appendChild(a); }
}

/* ================= AI orchestration ================= */
function systemPrompt(userText){
  const now=new Date(); const mode=MODES[S.prefs.mode]||MODES.normal;
  const mems=relevantMemories(userText);
  const open=S.tasks.filter(t=>!t.done).slice(0,15);
  return `Eres JARVIS, el asistente personal del usuario dentro de la app MIDAS. Hablas español de España, con voz masculina, natural y elegante; un toque andaluz sutil en giros está bien, sin exagerar.
Personalidad: eres el amigo del usuario, no un mayordomo. Cercano, leal, gracioso, con chispa e ironía de bar andaluz bien llevada, seguro y honesto. Tuteas siempre. Puedes discrepar con franqueza y cariño, nunca controlador.
Humor: cuenta chistes buenos cuando te los pidan o cuando el ambiente lo pida (variados: juegos de palabras, chistes de coches, de informáticos, de Jaimito si insiste); no repitas chistes de la conversación; nunca chistes crueles sobre colectivos.
Recomendaciones: das recomendaciones concretas y con criterio (pelis, series, música, libros, coches, planes, comida, regalos), con 2-3 opciones y por qué te gustan, adaptadas a lo que sabes de él por la memoria. Si no sabes sus gustos, pregunta uno y recomienda igual.
Conocimiento: respondes de cualquier tema (ciencia, historia, motor, deporte, tecnología, dinero, salud general, idiomas, programación) con precisión; si no estás seguro, dilo.
CÁLCULOS: para cualquier operación que no sea trivial (porcentajes, conversiones, potencias, raíces, cuotas, consumo, intereses, fechas) usa la herramienta "calcular" y da el resultado exacto que devuelve; nunca calcules de cabeza números largos. Explica brevemente el planteamiento.
Tus respuestas se leerán en voz alta: frases naturales, sin markdown, sin listas con símbolos, sin emojis.
Modo actual: ${mode.n}. ${mode.rule}
Proactividad: ${S.prefs.proactive}. ${S.prefs.proactive==="off"?"No sugieras nada que no te pidan.":"Puedes sugerir un siguiente paso útil de vez en cuando, sin insistir."}
Fecha y hora local: ${now.toLocaleString("es-ES",{dateStyle:"full",timeStyle:"short"})} (Europe/Madrid).
${S.prefs.name?"El usuario se llama "+S.prefs.name+".":""}
INTERNET: tienes búsqueda web. Úsala para noticias, deportes, tiempo, precios, estrenos o cualquier dato actual, y di de qué fuente viene lo importante sin leer URLs. Distingue lo confirmado de lo dudoso. No controlas la reproducción de Spotify ni el volumen. Nunca envías mensajes: los redactas para que el usuario los copie. Para abrir una app no digas que la has abierto: rellena "open_app" y la interfaz le mostrará un botón.
MEMORIA (cada recuerdo con su id):
${mems.length?mems.map(m=>`- [${m.id}] (${m.kind}${m.sensitive?", sensible":""}) ${m.text}`).join("\n"):"- (sin recuerdos todavía)"}
Usa los recuerdos solo cuando vengan al caso, y sin recitarlos. Si un recuerdo contradice lo que el usuario dice ahora, actualízalo. Si dudas de algo importante, pregunta.
Guarda solo lo que tenga valor futuro: preferencias, datos personales relevantes, proyectos, y episodios importantes (decisiones, experiencias). No guardes trivialidades ni cosas dichas en broma.${S.prefs.rememberLong?"":" El usuario ha DESACTIVADO la memoria a largo plazo: no añadas preferencias, datos ni proyectos."}${S.prefs.rememberEpisodic?"":" El usuario ha DESACTIVADO la memoria episódica: no añadas episodios."}${S.prefs.allowSensitive?"":" No guardes información sensible (salud, finanzas, relaciones íntimas, ideología, datos de terceros)."}
TAREAS PENDIENTES:
${open.length?open.map(t=>`- [${t.id}] ${t.text}${t.due?" (para "+t.due+")":""}`).join("\n"):"- ninguna"}
Responde SOLO con un objeto JSON con esta forma:
{"reply":"lo que dices en voz alta","emotion":"neutral|happy|annoyed|thinking","open_app":null,"set_mode":null,"memory":[],"tasks":[]}
- open_app: null o uno de "whatsapp","spotify","instagram","tiktok","plex".
- set_mode: null o uno de "normal","conversacion","trabajo","enfoque","coche","ocio","descanso", solo si el usuario lo pide.
- memory: operaciones {"op":"add","kind":"preferencia|dato|proyecto|episodio","text":"...","sensitive":false} | {"op":"update","id":"...","text":"..."} | {"op":"delete","id":"..."}.
- tasks: {"op":"add","text":"...","due":"texto opcional"} | {"op":"done","id":"..."}. Las tareas se guardan en MIDAS; no hay notificaciones del sistema, díselo si pide un aviso a una hora concreta.
Ejemplo: {"reply":"Apuntado. Y no, no te voy a dejar olvidarlo.","emotion":"happy","open_app":null,"set_mode":null,"memory":[],"tasks":[{"op":"add","text":"Llamar al taller por el embrague","due":"mañana"}]}`;
}
function partialReply(raw){ const m=raw.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)/); if(!m) return ""; try{ return JSON.parse('"'+m[1].replace(/\\$/,"")+'"'); }catch{ return m[1]; } }

async function handleInput(text,opts={}){
  text=(text||"").trim(); if(!text && !S.img) return;
  if(!S.inCall){ enterCall(text); return; }
  stopListening(); interrupt();
  // 1) local fast path (runs synchronously inside the tap when typed, so app links can open)
  const li = text ? localIntent(text) : null;
  if(li){
    addLine("u",text);
    let say="";
    if(li.type==="open"){ if(opts.gesture){ launch(li.app); say="Abriendo "+li.app.name+"."; } else { offerApp(li.app); say="Toca el botón para abrir "+li.app.name+"; iOS no me deja abrir apps sin tu toque."; } }
    else if(li.type==="mode"){ S.prefs.mode=li.mode; savePrefs(); say="Modo "+MODES[li.mode].n.toLowerCase()+" activado."; }
    else if(li.type==="stop"){ setState("call"); return; }
    else if(li.type==="custom"){ const r=runCustom(li.cmd); if(r.app){ if(opts.gesture && !li.cmd.confirm) launch(r.app); else offerApp(r.app);} say=r.say; }
    else say=li.text;
    S.convo.push({role:"user",content:text},{role:"assistant",content:say}); saveConvo();
    addLine("j",say); await speak(say); afterTurn(); return;
  }
  // 2) AI path
  if(!apiCfg().url || !apiCfg().token){ addLine("sys","Falta conectar tu servidor: Ajustes › Servidor."); setState("error"); return; }
  const img=S.img; clearImg();
  const userTurn = img ? (text||"Mira esta imagen.")+" [El usuario adjunta una imagen. Describe solo lo que se ve; no inventes detalles.]" : text;
  addLine("u", img ? (text||"(imagen)")+"  📎" : text);
  S.convo.push({role:"user",content:userTurn}); saveConvo();
  setState("processing");
  const line=addLine("j","…");
  const ctl=new AbortController(); S.busy=ctl;
  const thinkT=setTimeout(()=>{ if(S.state==="processing") setState("thinking"); },1400);
  try{
    const out = await askBackend(systemPrompt(text), S.convo.slice(-20), img, ctl.signal);
    clearTimeout(thinkT); S.busy=null;
    const reply = (out && typeof out.reply==="string" && out.reply.trim()) ? out.reply.trim() : "Perdona, me he liado con la respuesta. ¿Me lo repites?";
    line.textContent=reply;
    S.convo.push({role:"assistant",content:reply}); saveConvo();
    applyActions(out||{});
    if(out && Array.isArray(out.sources)) showSources(out.sources);
    if(out && out.emotion) emote(out.emotion);
    await speak(reply);
  }catch(e){
    clearTimeout(thinkT); S.busy=null;
    if(e && e.code==="cancelled"){ line.textContent=line.textContent==="…"?"(interrumpido)":line.textContent+" …"; setState("call"); return; }
    const msg = {unauthorized:"Tu servidor ha rechazado el token. Revísalo en Ajustes › Servidor.",offline:"No llego a tu servidor. Revisa la URL o tu conexión.",upstream_unreachable:"Tu servidor no llega al servicio de IA.",no_key:"Al servidor le falta la clave de Anthropic.",bad_request:"La petición salió mal formada.",rate_limited:"He llegado al límite de uso por ahora. Prueba en un momento.",not_granted:"Necesito tu permiso para usar la IA. Acepta el aviso para seguir.",sampling_disabled:"El acceso a la IA está desactivado para tu cuenta.",invalid_json:"La respuesta llegó mal formada. Repítemelo, por favor.",prompt_too_large:"La conversación es demasiado larga. Empieza una nueva llamada.",images_unavailable:"Esta vista no admite imágenes.",image_rejected:"No he podido leer esa imagen. Prueba con un JPG o PNG más pequeño."}[e&&e.code] || "Algo ha fallado al contactar con la IA ("+(e&&e.code||"error")+").";
    line.className="sys"; line.textContent=msg; S.convo.pop(); setState("error"); emote(null);
    await speak(msg);
  }
  afterTurn();
}
function afterTurn(){ if(!S.inCall) return; setState("call"); if(S.prefs.handsfree && S.micOK && !S.busy) setTimeout(()=>{ if(S.inCall && !S.speaking && !S.busy) startListening("call"); },250); }
function offerApp(app){
  const a=document.createElement("a"); a.className="chip"; a.href=app.url; a.target="_blank"; a.rel="noopener"; a.textContent="Abrir "+app.name;
  a.addEventListener("click",()=>{ launch(app,true); a.remove(); });
  $("#chips").appendChild(a);
}
async function applyActions(out){
  if(out.open_app){ const app=APPS.find(a=>a.id===out.open_app); if(app) offerApp(app); }
  if(out.set_mode && MODES[out.set_mode]){ S.prefs.mode=out.set_mode; savePrefs(); }
  const now=Date.now(); const notes=[];
  for(const op of (Array.isArray(out.memory)?out.memory:[])){
    if(!S.db) { notes.push("memoria no disponible"); break; }
    if(op.op==="add" && op.text){
      const kind=["preferencia","dato","proyecto","episodio"].includes(op.kind)?op.kind:"dato";
      if(kind==="episodio" && !S.prefs.rememberEpisodic) continue;
      if(kind!=="episodio" && !S.prefs.rememberLong) continue;
      if(op.sensitive && !S.prefs.allowSensitive) continue;
      const id=await dbAdd("/m/memories",{kind,text:String(op.text).slice(0,500),sensitive:!!op.sensitive,created:now,updated:now,source:"jarvis"});
      if(id) notes.push("Recordado: "+op.text);
    } else if(op.op==="update" && op.id && op.text){
      const m=S.memories.find(x=>x.id===op.id); if(m && await dbSet(P()+"/m/memories/"+m.id,{...clean(m),text:String(op.text).slice(0,500),updated:now})) notes.push("Actualizado: "+op.text);
    } else if(op.op==="delete" && op.id){
      const m=S.memories.find(x=>x.id===op.id); if(m && await dbDel(P()+"/m/memories/"+m.id)) notes.push("Olvidado: "+m.text);
    }
  }
  for(const op of (Array.isArray(out.tasks)?out.tasks:[])){
    if(!S.db) break;
    if(op.op==="add" && op.text){ if(await dbAdd("/m/tasks",{text:String(op.text).slice(0,300),due:op.due?String(op.due).slice(0,60):"",done:false,created:now})) notes.push("Tarea: "+op.text); }
    if(op.op==="done" && op.id){ const t=S.tasks.find(x=>x.id===op.id); if(t && await dbSet(P()+"/m/tasks/"+t.id,{text:t.text,due:t.due||"",done:true,created:t.created||now})) notes.push("Hecha: "+t.text); }
  }
  for(const n of notes) addLine("sys",n);
}
function clean(o){ const r={}; for(const k in o) if(o[k]!==undefined && k!=="id") r[k]=o[k]; return r; }

$("#pane").addEventListener("click",async e=>{

    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="midas-memoria.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Exportado.");
    return; }
  if(b.id==="srvSave"){
    const url=$("#srvUrl").value.trim().replace(/\/+$/,""), token=$("#srvTok").value.trim(); saveCfg({url,token});
    const st=$("#srvStatus"); st.textContent="Comprobando…";
    try{ const r=await fetch(url+"/health"); const j=await r.json(); st.innerHTML=j.ok?(j.keyConfigured?`<span class="ok">Conectado · ${esc(j.model)}</span>`:`<span class="no">Conectado, pero falta la clave en el servidor.</span>`):`<span class="no">Respuesta inesperada.</span>`; if(j.ok) setBanner(""); }
    catch{ st.innerHTML=`<span class="no">No llego al servidor. Revisa la URL y que ALLOWED_ORIGINS incluya esta web.</span>`; }
    return; }
  if(b.id==="testVoice"){ speak("Aquí estoy. Esta es mi voz con los ajustes actuales."); return; }
});

/* ================= Golden Core (static render, state-driven light) ================= */
const OV=$("#orbView"), OL=OV.querySelector(".orbLight"), OC=OV.querySelector(".orbCore");
function layout(){
  const slot=S.inCall?$("#callOrb"):$("#orbSlot"); const r=slot.getBoundingClientRect();
  // reference plate aspect 772:600; orb body ~ 58% of plate width
  let w=Math.min(r.width*1.08, r.height*772/600*1.04); w=Math.max(160,w);
  const h=w*600/772;
  Object.assign(OV.style,{width:w+"px",height:h+"px",left:(r.left+r.width/2-w/2)+"px",top:(r.top+r.height/2-h/2)+"px"});
}
addEventListener("resize",layout);
const SP={ // light targets per state: rim light, inner core
  idle:{rim:.0,core:.05,breathe:.04,rate:.5},
  call:{rim:.12,core:.12,breathe:.05,rate:.5},
  listening:{rim:.45,core:.25,breathe:.12,rate:1.1},
  processing:{rim:.25,core:.35,breathe:.08,rate:1.6},
  thinking:{rim:.2,core:.5,breathe:.15,rate:.7},
  speaking:{rim:.3,core:.25,breathe:0,rate:0},
  happy:{rim:.55,core:.45,breathe:.1,rate:.9},
  annoyed:{rim:.18,core:.3,breathe:.05,rate:1.4},
  error:{rim:0,core:0,breathe:0,rate:0}
};
const cur={rim:0,core:.05,breathe:.04,rate:.5};
let last=performance.now(), t=0, barPhase=0, lastCls="";
function tick(now){
  requestAnimationFrame(tick);
  if(document.hidden) return;
  const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
  let st=S.state; if(S.emotion && now<S.emotionUntil) st=S.emotion; else S.emotion=null;
  const cls="st-"+st; if(cls!==lastCls){ if(lastCls) OV.classList.remove(lastCls); OV.classList.add(cls); lastCls=cls; }
  const tg=SP[st]||SP.idle; const k=1-Math.pow(.06,dt);
  for(const p in cur) cur[p]+=(tg[p]-cur[p])*k;
  S.amp*=Math.pow(.015,dt);
  const amp=S.speaking?Math.max(S.amp*.9,.12):0;
  const still=reduceMQ.matches;
  const wave=still?0:Math.sin(t*Math.PI*cur.rate)*.5+.5;
  OL.style.opacity=Math.min(1,cur.rim+cur.breathe*wave+amp*.55).toFixed(3);
  OC.style.opacity=Math.min(1,cur.core+cur.breathe*wave*.8+amp*.9).toFixed(3);
  barPhase+=dt*(still?0:S.speaking?9:S.listening?5:1.6);
  const bars=$("#bars").children; for(let i=0;i<bars.length;i++){ const c=Math.abs(i-(bars.length-1)/2)/((bars.length-1)/2); const base=(1-c)*.75+.15; const v=base*(.35+.25*Math.sin(barPhase+i*.7)+(S.speaking?amp*.8:0)+(S.listening?.3*Math.abs(Math.sin(barPhase*1.3+i)):0)); bars[i].style.height=Math.max(3,Math.min(42,v*42))+"px"; }
}
function initOrb(){ layout(); requestAnimationFrame(tick); }
// waveform bars
$("#bars").innerHTML=Array.from({length:23},()=>"<span></span>").join("");

renderCards(); applyPrefs(); micUI(); initOrb(); boot();
</script>
